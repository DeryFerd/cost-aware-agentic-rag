name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
        pip install -r requirements.txt
    
    - name: Run linter
      run: |
        ruff check src/ api/ --output-format=github

  test:
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-mock
    
    - name: Run tests (skip slow/integration)
      run: |
        python -m pytest tests/ -v --tb=short -m "not slow and not integration"

  eval:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run eval harness
      run: |
        python -m src.eval.harness --output data/eval/harness_results.json
      env:
        OLLAMA_HOST: ${{ secrets.OLLAMA_HOST }}
        OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

    - name: Upload eval results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: eval-results
        path: data/eval/harness_results.json
        retention-days: 30

    - name: Run cost-quality regression gate
      run: |
        python scripts/cost_quality_report.py --queries 5
      env:
        OLLAMA_HOST: ${{ secrets.OLLAMA_HOST }}
        OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

    - name: Upload cost-quality report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cost-quality-report
        path: data/eval/cost_quality_report.json
        retention-days: 30

  docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        docker build -t cost-aware-rag .
